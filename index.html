<style>
/* Layout: a toy-shop shelf of puzzle boxes, then a full-screen wooden table with a recessed puzzle tray */
:root{
  --table:#d6a46a;
  --wood-deep:#7a4a24;
  --ink:#3b2414;
  --paper:#fff6e6;
  --paper-edge:#d9bf93;
  --red:#e4553f;
  --mustard:#f3b634;
  --teal:#1d8584;
  --leaf:#4f9a3f;
  --shade:rgba(59,36,20,.28);
  --f-display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none;touch-action:manipulation}
body{
  background:
    radial-gradient(ellipse at 50% -10%,rgba(255,240,210,.45),transparent 60%),
    repeating-linear-gradient(91deg,rgba(120,70,30,.07) 0 2px,transparent 2px 11px,rgba(255,235,200,.08) 11px 12px,transparent 12px 27px),
    var(--table);
  color:var(--ink);font-family:var(--f-display);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
#app{height:100%}

/* ---------- Home ---------- */
#home{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:880px;margin:0 auto;padding-block:20px 36px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
.sign{text-align:center;display:flex;flex-direction:column;gap:4px}
.sign h1{margin:0;font-size:clamp(2rem,5.6vw,3.3rem);font-weight:800;line-height:1;letter-spacing:.01em;text-wrap:balance}
.sign h1 span{display:inline-block;text-shadow:0 3px 0 rgba(59,36,20,.55),0 6px 0 rgba(59,36,20,.35),0 12px 16px rgba(59,36,20,.25)}
.sign h1 span:nth-child(odd){transform:rotate(-3deg)}
.sign h1 span:nth-child(even){transform:rotate(3deg) translateY(2px)}
.sign p{margin:0;font-size:1rem;font-weight:600;color:var(--wood-deep)}
.label{font-size:.85rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--wood-deep);margin:0 0 10px}
.sizes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:560px}
.size{border:none;background:var(--paper);border-radius:16px;padding:10px 8px 8px;
  box-shadow:0 5px 0 var(--paper-edge),0 10px 16px var(--shade);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .08s}
.size:active{transform:translateY(3px);box-shadow:0 2px 0 var(--paper-edge),0 4px 8px var(--shade)}
.size[aria-pressed="true"]{background:var(--mustard);box-shadow:0 5px 0 #b9831c,0 10px 16px var(--shade)}
.mini{display:grid;gap:1.5px;width:36px;height:36px}
.mini i{background:var(--teal);border-radius:2px}
.size[aria-pressed="true"] .mini i{background:var(--ink)}
.size b{font-size:1.1rem;line-height:1}
.size small{font-size:.85rem;font-weight:700;opacity:.75;line-height:1}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:18px}
.box{border:none;background:var(--paper);border-radius:18px;padding:10px 10px 8px;text-align:left;
  box-shadow:0 7px 0 var(--paper-edge),0 16px 24px var(--shade);display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.box:hover{transform:translateY(-3px) rotate(-.6deg)}
.box:active{transform:translateY(4px);box-shadow:0 3px 0 var(--paper-edge),0 6px 10px var(--shade)}
.box canvas,.box .ph{width:100%;aspect-ratio:1;border-radius:11px;display:block;max-width:100%}
.box .ph{border:3px dashed var(--paper-edge);display:grid;place-items:center;color:var(--teal);background:#fffaf1}
.box .ph svg{width:44%;height:auto}
.box .nm{font-weight:800;font-size:1rem;line-height:1.1;padding-inline:2px}
.stars{display:flex;gap:2px;height:20px}
.stars svg{width:20px;height:20px}
.tip{text-align:center;font-weight:600;color:var(--wood-deep);margin:0;font-size:1rem}

/* ---------- Game ---------- */
#game{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding-block:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--wood-deep);box-shadow:0 4px 0 rgba(0,0,0,.18);position:relative;z-index:2}
.tbtn{border:none;height:42px;min-width:44px;padding:0 11px;border-radius:13px;background:var(--paper);
  box-shadow:0 4px 0 var(--paper-edge);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:1rem;transition:transform .08s}
.tbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--paper-edge)}
.tbtn[aria-pressed="true"]{background:var(--mustard);box-shadow:0 4px 0 #b9831c}
.tbtn svg{width:22px;height:22px;flex:none}

const SCENES=[
{id:'farm',name:'Sunny Farm',draw(c){

{id:'sea',name:'Under the Sea',draw(c){

/* ---------- jigsaw geometry ---------- */
// one tab, symmetric about u = 0.5, in (along-edge u, outward v) units of the edge length
const TAB=[[.42,0,.45,.05,.41,.10],[.36,.17,.38,.27,.5,.27],[.62,.27,.64,.17,.59,.10],[.55,.05,.58,0,.64,0]];
function edgeTo(P,ax,ay,bx,by,e){
  if(!e){P.lineTo(bx,by);return}
  const dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=uy,ny=-ux;
  const pt=(u,v)=>{u=.5+e.j+(u-.5)*e.k;v=v*e.k*e.t;return[ax+(ux*u+nx*v)*L,ay+(uy*u+ny*v)*L]};
  const a=pt(.36,0);P.lineTo(a[0],a[1]);
  for(const q of TAB){const p1=pt(q[0],q[1]),p2=pt(q[2],q[3]),p3=pt(q[4],q[5]);P.bezierCurveTo(p1[0],p1[1],p2[0],p2[1],p3[0],p3[1])}
  P.lineTo(bx,by);
}
function piecePath(p,s,ox,oy){const P=new Path2D(),x0=ox,y0=oy,x1=ox+s,y1=oy+s;P.moveTo(x0,y0);
  edgeTo(P,x0,y0,x1,y0,p.e[0]);edgeTo(P,x1,y0,x1,y1,p.e[1]);edgeTo(P,x1,y1,x0,y1,p.e[2]);edgeTo(P,x0,y1,x0,y0,p.e[3]);P.closePath();return P}
function makePieces(n,seed){
  const r=rng(seed),H=[],V=[],mk=()=>({t:r()<.5?1:-1,j:(r()-.5)*.1,k:.92+r()*.16});
  for(let y=0;y<=n;y++){H[y]=[];V[y]=[];for(let x=0;x<=n;x++){H[y][x]=mk();V[y][x]=mk()}}
  const out=[];
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const e=[null,null,null,null];
    if(y>0){const h=H[y][x];e[0]={t:-h.t,j:h.j,k:h.k}}
    if(x<n-1){const v=V[y][x+1];e[1]={t:v.t,j:v.j,k:v.k}}
    if(y<n-1){const h=H[y+1][x];e[2]={t:h.t,j:-h.j,k:h.k}}
    if(x>0){const v=V[y][x];e[3]={t:-v.t,j:-v.j,k:v.k}}
    out.push({i:y*n+x,r:y,c:x,e,x:0,y:0,locked:false,lift:0,liftT:0,anim:null,nx:null,ny:null});
  }
  return out;
}

function startGame(scene,n,snap){
  G.scene=scene;G.n=n;G.seed=snap&&snap.seed?snap.seed:(Math.random()*1e9|0);
  G.pieces=makePieces(n,G.seed);G.hints=snap&&snap.hints||0;G.done=false;G.hint=null;G.drag=null;G.particles=[];G.pic=null;G.mode='';
  $('#home').hidden=true;$('#game').hidden=false;$('#win').hidden=true;
  $('#gName').textContent=scene.name;
  setToggle($('#bGuide'),G.guide);setToggle($('#bSound'),G.sound);
  layout(true);
  if(snap&&snap.ps){
    const byI={};G.pieces.forEach(p=>byI[p.i]=p);
    snap.ps.forEach(q=>{const p=byI[q.i];if(!p)return;if(q.l){p.locked=true}else if(q.nx!=null){p.nx=q.nx;p.ny=q.ny}});
    G.pieces.sort((a,b)=>(b.locked?1:0)-(a.locked?1:0));placeAll(false);
  }
  updateCount();
  if(!G.running){G.running=true;requestAnimationFrame(frame)}
}

function layout(rescatter){

  G.W=W;G.H=H;G.dpr=dpr;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const m=18,mode=W>H*1.05?'land':'port';
  let size;
  if(mode==='land'){size=Math.min((H-2*m)*.74,(W-3*m)*.43);G.board={x:m+24,y:(H-size)/2,size}}
  else{size=Math.min((W-2*m)*.7,H*.4);G.board={x:(W-size)/2,y:m+18,size}}
  size=Math.max(120,Math.floor(size));G.board.size=size;
  const n=G.n,s=size/n;G.s=s;G.pad=s*.42;
  const t=s*.3;

  else{const y=G.board.y+size+m+t+12;G.tray={x:m+t,y,w:W-2*(m+t),h:H-y-m-t}}
  {const T=G.tray,L=Math.max(70,Math.floor(mode==='land'?Math.min(T.w*.6,T.h*.42,280):Math.min(T.w*.4,T.h*.72,230)));

function scatter(){
  const T=G.tray,s=G.s,loose=G.pieces.filter(p=>!p.locked),N=loose.length;
  const order=loose.slice().sort(()=>Math.random()-.5),Ld=G.lid;
  // spots on a grid over the tray, skipping the picture card; tighten the grid until every piece has a spot
  let step=s*1.12,spots=[];
  for(let tries=0;tries<14;tries++){spots=[];
    const cols=Math.max(1,Math.floor(Math.max(0,T.w-s)/step)+1),rows=Math.max(1,Math.floor(Math.max(0,T.h-s)/step)+1);
    const gw=step*(cols-1)+s,gh=step*(rows-1)+s,ox=T.x+Math.max(0,(T.w-gw)/2),oy=T.y+Math.max(0,(T.h-gh)/2);
    for(let r=0;r<rows;r++)for(let cc=0;cc<cols;cc++){const x=ox+cc*step,y=oy+r*step;
      if(Ld&&x<Ld.x+Ld.size+6&&x+s>Ld.x-6&&y<Ld.y+Ld.size+6&&y+s>Ld.y-6)continue;spots.push([x,y])}
    if(spots.length>=N)break;step*=.88}
  if(!spots.length)spots.push([T.x,T.y]);
  order.forEach((p,k)=>{const q=spots[k%spots.length],extra=Math.floor(k/spots.length)*s*.25;
    p.x=q[0]+extra+(Math.random()-.5)*s*.14;p.y=q[1]+extra+(Math.random()-.5)*s*.14;clampPiece(p);p.nx=p.x/G.W;p.ny=p.y/G.H});
  placeAll(true);
}
function placeAll(keepLoose){G.pieces.forEach(p=>{if(p.locked){const t=target(p);p.x=t.x;p.y=t.y;p.anim=null}else if(!keepLoose&&p.nx!=null){p.x=p.nx*G.W;p.y=p.ny*G.H;clampPiece(p)}})}
function clampPiece(p){const s=G.s;p.x=Math.min(Math.max(p.x,-s*.15),G.W-s*.85);p.y=Math.min(Math.max(p.y,-s*.15),G.H-s*.85)}
function updateCount(){const k=G.pieces.filter(p=>p.locked).length;$('#gCount').textContent=k+' of '+G.pieces.length+' placed'}

/* ---------- input ---------- */
function ptr(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function hit(p,x,y){const lx=x-(p.x-G.pad),ly=y-(p.y-G.pad);
  if(x>=p.x+G.s*.08&&x<=p.x+G.s*.92&&y>=p.y+G.s*.08&&y<=p.y+G.s*.92)return true;return hitCtx.isPointInPath(p.path,lx,ly)}
cv.addEventListener('pointerdown',e=>{
  if(G.done||G.drag)return;ac();const q=ptr(e);
  for(let k=G.pieces.length-1;k>=0;k--){const p=G.pieces[k];if(p.locked)continue;
    if(hit(p,q.x,q.y)){G.pieces.splice(k,1);G.pieces.push(p);G.drag={p,dx:q.x-p.x,dy:q.y-p.y,id:e.pointerId};p.liftT=1;p.anim=null;
      try{cv.setPointerCapture(e.pointerId)}catch(_){}sfx.pick();e.preventDefault();break}}
});
cv.addEventListener('pointermove',e=>{const d=G.drag;if(!d||d.id!==e.pointerId)return;const q=ptr(e);d.p.x=q.x-d.dx;d.p.y=q.y-d.dy;clampPiece(d.p)});
function endDrag(e){const d=G.drag;if(!d||d.id!==e.pointerId)return;G.drag=null;drop(d.p)}
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
function drop(p){
  const t=target(p),tol=Math.max(20,G.s*.3);
  if(Math.hypot(p.x-t.x,p.y-t.y)<tol){lock(p)}else{p.liftT=0;p.nx=p.x/G.W;p.ny=p.y/G.H}
}
function lock(p){
  const t=target(p);p.locked=true;p.liftT=0;p.anim={fx:p.x,fy:p.y,tx:t.x,ty:t.y,t0:performance.now(),dur:110};
  G.pieces.splice(G.pieces.indexOf(p),1);G.pieces.unshift(p);
  if(G.hint&&G.hint.p===p)G.hint=null;
  sparkle(t.x+G.s/2,t.y+G.s/2);sfx.snap();updateCount();
  if(G.pieces.every(q=>q.locked))win();
}

/* ---------- hint, win, particles ---------- */
$('#bHint').onclick=()=>{
  if(G.done)return;const loose=G.pieces.filter(p=>!p.locked);if(!loose.length)return;
  const lockedSet=new Set(G.pieces.filter(p=>p.locked).map(p=>p.r+','+p.c));
  const nb=p=>[[0,1],[1,0],[0,-1],[-1,0]].some(d=>lockedSet.has((p.r+d[0])+','+(p.c+d[1])));
  const edge=p=>p.r===0||p.c===0||p.r===G.n-1||p.c===G.n-1;
  const pick=loose.find(nb)||loose.find(edge)||loose[0];
  G.pieces.splice(G.pieces.indexOf(pick),1);G.pieces.push(pick);
  G.hint={p:pick,t0:performance.now()};G.hints++;sfx.hint();
};
function sparkle(x,y){const cols=['#ffd23f','#ffffff','#ff9f1c'],n=reduceMotion?4:12;for(let i=0;i<n;i++){const a=Math.random()*TAU,v=1.5+Math.random()*3;
  G.particles.push({k:'s',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,col:cols[i%3],sz:3+Math.random()*3})}}
function confetti(){const cols=['#e4553f','#f3b634','#1d8584','#4f9a3f','#8338ec','#ff7eb6'],n=reduceMotion?30:140;
  for(let i=0;i<n;i++)G.particles.push({k:'c',x:Math.random()*G.W,y:-20-Math.random()*G.H*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,life:1,col:cols[i%cols.length],sz:6+Math.random()*6,rot:Math.random()*TAU,vr:(Math.random()-.5)*.3})}
function win(){
  G.done=true;G.hint=null;const k=G.hints===0?3:G.hints<=2?2:1;
  const key=G.scene.id+'_'+G.n;if((best[key]||0)<k){best[key]=k;store.set('jt_best',best)}
  setTimeout(()=>{sfx.win();confetti()},250);
  setTimeout(()=>{$('#wStars').innerHTML=starsHTML(k);
    $('#wText').textContent=G.pieces.length+' pieces · '+(G.hints===0?'no hints':G.hints===1?'1 hint':G.hints+' hints');
    $('#wNext').hidden=G.scene.id==='photo';$('#win').hidden=false},1100);
}
$('#wNext').onclick=()=>{const i=SCENES.findIndex(s=>s.id===G.scene.id);startGame(SCENES[(i+1)%SCENES.length],G.n)};
$('#wAgain').onclick=()=>startGame(G.scene,G.n);
$('#wHome').onclick=goHome;
$('#bBack').onclick=goHome;
function goHome(){G.running=false;G.drag=null;$('#game').hidden=true;$('#home').hidden=false;refreshStars()}
$('#bGuide').onclick=()=>{G.guide=!G.guide;store.set('jt_guide',G.guide);setToggle($('#bGuide'),G.guide);buildLayer()};
$('#bSound').onclick=()=>{G.sound=!G.sound;store.set('jt_sound',G.sound);setToggle($('#bSound'),G.sound);
  $('#icoSound').innerHTML=G.sound?'<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>':'<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/>';if(G.sound)ac()};

/* ---------- render loop ---------- */
function frame(now){
  if(!G.running)return;requestAnimationFrame(frame);
  const c=ctx,d=G.dpr,s=G.s,pad=G.pad,sz=s+2*pad;
  G.pieces.forEach(p=>{
    if(p.anim){const a=p.anim,t=Math.min(1,(now-a.t0)/a.dur),e=1-Math.pow(1-t,3);p.x=a.fx+(a.tx-a.fx)*e;p.y=a.fy+(a.ty-a.fy)*e;if(t>=1)p.anim=null}
    p.lift+=(p.liftT-p.lift)*.3;if(Math.abs(p.liftT-p.lift)<.01)p.lift=p.liftT;
  });
  c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,G.W,G.H);
  if(G.layer)c.drawImage(G.layer,0,0,G.W,G.H);
  const h=G.hint;let pulse=0;
  if(h){const el=now-h.t0;if(el>3200)G.hint=null;else{pulse=.5+.5*Math.sin(el/140);
    const t=target(h.p);c.save();c.translate(t.x-pad,t.y-pad);c.lineWidth=4;c.strokeStyle='rgba(243,182,52,'+(.45+.55*pulse).toFixed(2)+')';c.stroke(h.p.path);c.restore()}}
  for(const p of G.pieces){
    const lf=p.lift;
    if(lf>0.01||(G.hint&&G.hint.p===p)){
      const sc=1+.06*lf,cx=p.x+s/2,cy=p.y+s/2-4*lf;
      c.save();c.translate(cx,cy);c.scale(sc,sc);
      if(G.hint&&G.hint.p===p){c.shadowColor='rgba(255,205,50,'+(.6+.4*pulse).toFixed(2)+')';c.shadowBlur=(14+14*pulse)*d}
      else{c.shadowColor='rgba(40,20,5,.35)';c.shadowBlur=18*lf*d;c.shadowOffsetY=12*lf*d}
      c.drawImage(p.sprite,-s/2-pad,-s/2-pad,sz,sz);c.restore();
    }else c.drawImage(p.sprite,p.x-pad,p.y-pad,sz,sz);
  }
  if(G.particles.length){
    G.particles=G.particles.filter(q=>q.life>0&&q.y<G.H+40);
    for(const q of G.particles){
      q.x+=q.vx;q.y+=q.vy;
      if(q.k==='s'){q.vx*=.92;q.vy*=.92;q.life-=.035;c.globalAlpha=Math.max(0,q.life);star5(c,q.x,q.y,q.sz,q.sz*.45,q.col)}
      else{q.vy+=.03;q.rot+=q.vr;q.x+=Math.sin(q.rot)*.6;c.save();c.translate(q.x,q.y);c.rotate(q.rot);c.fillStyle=q.col;c.fillRect(-q.sz/2,-q.sz/4,q.sz,q.sz/2);c.restore()}
    }
    c.globalAlpha=1;
  }
}
let rzT=0;
new ResizeObserver(()=>{if(!G.running||!G.scene)return;clearTimeout(rzT);rzT=setTimeout(()=>layout(false),80)}).observe($('#stage'));

/* ---------- boot (keeps an open game across page updates) ---------- */
// stop iPad pinch-zoom from moving the table (touch-action:manipulation already stops double-tap zoom)
document.addEventListener('gesturestart',e=>e.preventDefault());
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>G.running&&G.scene&&G.scene.id!=='photo'&&!G.done
  ?{scene:G.scene.id,n:G.n,seed:G.seed,hints:G.hints,ps:G.pieces.map(p=>({i:p.i,l:p.locked,nx:p.locked?null:p.x/G.W,ny:p.locked?null:p.y/G.H}))}:{});
function boot(data){
  buildHome();
  if(data&&data.scene){const sc=SCENES.find(s=>s.id===data.scene);if(sc)startGame(sc,data.n||4,data)}
}
if(hot&&hot.ready)hot.ready(boot);else boot(hot&&hot.data||{});
})();
</script>

</body></html>
